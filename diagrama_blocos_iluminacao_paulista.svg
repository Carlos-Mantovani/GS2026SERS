<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="915" viewBox="0 0 680 610" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Diagrama de blocos da iluminação pública da Avenida Paulista</title>
<desc>Fluxo de energia da rede e da usina fotovoltaica até as luminárias LED, sensores e controle de dimerização, processamento dos dados e indicadores no Neighborhood Action Dashboard.</desc>
<style>
  text { font-family: Arial, Helvetica, sans-serif; }
  .bg { fill: #FFFFFF; }
  .th { font-size: 14px; font-weight: 700; }
  .ts { font-size: 12px; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.8; }
  .teal .th { fill: #085041; }
  .teal .ts { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.8; }
  .purple .th { fill: #3C3489; }
  .purple .ts { fill: #534AB7; }
  .lg { fill: #2C2C2A; font-size: 12px; }
  .dash { fill: none; stroke: #888780; stroke-width: 1; stroke-dasharray: 5 4; }
  .title { fill: #2C2C2A; font-size: 14px; font-weight: 700; }
  .arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
  .arr.d { stroke-dasharray: 5 4; }
  .mk { fill: none; stroke: #5F5E5A; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1F1F1E; }
    .teal rect { fill: #085041; stroke: #5DCAA5; }
    .teal .th { fill: #9FE1CB; }
    .teal .ts { fill: #5DCAA5; }
    .purple rect { fill: #3C3489; stroke: #AFA9EC; }
    .purple .th { fill: #CECBF6; }
    .purple .ts { fill: #AFA9EC; }
    .lg, .title { fill: #D3D1C7; }
    .dash { stroke: #B4B2A9; }
    .arr, .mk { stroke: #B4B2A9; }
  }
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path class="mk" d="M2 1L8 5L2 9"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="680" height="610"/>

<!-- Tier 1: fontes de energia -->
<g class="teal">
  <rect x="40" y="30" width="190" height="56" rx="8"/>
  <text class="th" x="135" y="48" text-anchor="middle" dominant-baseline="central">Rede elétrica</text>
  <text class="ts" x="135" y="66" text-anchor="middle" dominant-baseline="central">Alimenta à noite</text>
</g>
<g class="teal">
  <rect x="450" y="30" width="190" height="56" rx="8"/>
  <text class="th" x="545" y="48" text-anchor="middle" dominant-baseline="central">Usina FV remota</text>
  <text class="ts" x="545" y="66" text-anchor="middle" dominant-baseline="central">128 kWp, fora da via</text>
</g>
<line class="arr" x1="448" y1="58" x2="232" y2="58" marker-end="url(#arrow)"/>
<text class="lg" x="340" y="46" text-anchor="middle">compensação de créditos</text>

<!-- Tier 2: consumidores e controle -->
<g class="teal">
  <rect x="40" y="130" width="190" height="56" rx="8"/>
  <text class="th" x="135" y="148" text-anchor="middle" dominant-baseline="central">Luminárias LED</text>
  <text class="ts" x="135" y="166" text-anchor="middle" dominant-baseline="central">450 pontos de 100 W</text>
</g>
<g class="purple">
  <rect x="450" y="130" width="190" height="56" rx="8"/>
  <text class="th" x="545" y="148" text-anchor="middle" dominant-baseline="central">Controle de fluxo</text>
  <text class="ts" x="545" y="166" text-anchor="middle" dominant-baseline="central">100% a 60% na madrugada</text>
</g>
<line class="arr" x1="135" y1="86" x2="135" y2="128" marker-end="url(#arrow)"/>
<line class="arr d" x1="448" y1="158" x2="232" y2="158" marker-end="url(#arrow)"/>
<text class="lg" x="340" y="146" text-anchor="middle">comandos</text>

<!-- Tier 3: sensores e dados -->
<g class="purple">
  <rect x="40" y="240" width="190" height="56" rx="8"/>
  <text class="th" x="135" y="258" text-anchor="middle" dominant-baseline="central">Medição de consumo</text>
  <text class="ts" x="135" y="276" text-anchor="middle" dominant-baseline="central">kWh por ponto</text>
</g>
<g class="purple">
  <rect x="245" y="240" width="190" height="56" rx="8"/>
  <text class="th" x="340" y="258" text-anchor="middle" dominant-baseline="central">Agenda de operação</text>
  <text class="ts" x="340" y="276" text-anchor="middle" dominant-baseline="central">Anoitecer e amanhecer</text>
</g>
<g class="purple">
  <rect x="450" y="240" width="190" height="56" rx="8"/>
  <text class="th" x="545" y="258" text-anchor="middle" dominant-baseline="central">Sensor de presença</text>
  <text class="ts" x="545" y="276" text-anchor="middle" dominant-baseline="central">Retoma fluxo pleno</text>
</g>
<line class="arr d" x1="135" y1="186" x2="135" y2="238" marker-end="url(#arrow)"/>
<line class="arr d" x1="545" y1="238" x2="545" y2="188" marker-end="url(#arrow)"/>
<path class="arr d" d="M340 238 L340 213 L500 213 L500 188" marker-end="url(#arrow)"/>

<!-- Tier 4: processamento -->
<g class="purple">
  <rect x="40" y="350" width="380" height="56" rx="8"/>
  <text class="th" x="230" y="368" text-anchor="middle" dominant-baseline="central">Cálculo dos indicadores</text>
  <text class="ts" x="230" y="386" text-anchor="middle" dominant-baseline="central">E = P × t / 1000, cenários A, B e C</text>
</g>
<g class="purple">
  <rect x="470" y="350" width="170" height="56" rx="8"/>
  <text class="th" x="555" y="368" text-anchor="middle" dominant-baseline="central">Premissas</text>
  <text class="ts" x="555" y="386" text-anchor="middle" dominant-baseline="central">Tarifa e emissões</text>
</g>
<line class="arr d" x1="135" y1="296" x2="135" y2="348" marker-end="url(#arrow)"/>
<line class="arr d" x1="468" y1="378" x2="422" y2="378" marker-end="url(#arrow)"/>
<line class="arr d" x1="230" y1="406" x2="230" y2="448" marker-end="url(#arrow)"/>

<!-- Tier 5: dashboard -->
<rect class="dash" x="40" y="450" width="600" height="110" rx="12"/>
<text class="title" x="56" y="470" dominant-baseline="central">Neighborhood Action Dashboard (módulo SERS)</text>
<g class="purple">
  <rect x="52" y="490" width="104" height="56" rx="8"/>
  <text class="th" x="104" y="508" text-anchor="middle" dominant-baseline="central">Consumo</text>
  <text class="ts" x="104" y="526" text-anchor="middle" dominant-baseline="central">kWh/mês</text>
</g>
<g class="purple">
  <rect x="168" y="490" width="104" height="56" rx="8"/>
  <text class="th" x="220" y="508" text-anchor="middle" dominant-baseline="central">Economia</text>
  <text class="ts" x="220" y="526" text-anchor="middle" dominant-baseline="central">kWh/mês e %</text>
</g>
<g class="purple">
  <rect x="284" y="490" width="104" height="56" rx="8"/>
  <text class="th" x="336" y="508" text-anchor="middle" dominant-baseline="central">Custo</text>
  <text class="ts" x="336" y="526" text-anchor="middle" dominant-baseline="central">R$/mês</text>
</g>
<g class="purple">
  <rect x="400" y="490" width="104" height="56" rx="8"/>
  <text class="th" x="452" y="508" text-anchor="middle" dominant-baseline="central">Cobertura</text>
  <text class="ts" x="452" y="526" text-anchor="middle" dominant-baseline="central">FV (%)</text>
</g>
<g class="purple">
  <rect x="516" y="490" width="104" height="56" rx="8"/>
  <text class="th" x="568" y="508" text-anchor="middle" dominant-baseline="central">Emissões</text>
  <text class="ts" x="568" y="526" text-anchor="middle" dominant-baseline="central">kg CO₂e/ano</text>
</g>

<!-- Legenda -->
<g class="teal"><rect x="40" y="584" width="12" height="12" rx="2"/></g>
<text class="lg" x="58" y="590" dominant-baseline="central">Energia e equipamentos</text>
<g class="purple"><rect x="210" y="584" width="12" height="12" rx="2"/></g>
<text class="lg" x="228" y="590" dominant-baseline="central">Dados e software</text>
<text class="lg" x="360" y="590" dominant-baseline="central">Linha cheia: energia | tracejada: dados e comandos</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
